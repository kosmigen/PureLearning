site_name: PureLearning
site_description: Python、计算机基础与 AI 的学习笔记，以及做过的项目和写下的文章
site_author: kosmigen
site_url: https://kosmigen.github.io/PureLearning/
repo_url: https://github.com/kosmigen/PureLearning
repo_name: kosmigen/PureLearning
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Pure Learning

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/images/cipher-wheel.svg
  favicon: assets/images/cipher-wheel.svg
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: 跟随系统主题
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

plugins:
  - search:
      lang:
        - zh
        - en
  - awesome-nav
  - meta
  - blog:
      blog_dir: blog
      post_dir: "{blog}/posts"
      post_url_format: "{date}/{slug}"
      authors: true
      authors_file: "{blog}/.authors.yml"
      post_readtime: true
      archive: true
      archive_name: 时间归档
      archive_date_format: yyyy 年 MM 月
      archive_url_date_format: yyyy/MM
      archive_url_format: "archive/{date}"
      categories: false
      pagination: true
      pagination_per_page: 8
      pagination_format: "$link_first $link_previous ~2~ $link_next $link_last"
      draft: false
  - tags:
      filters:
        include:
          - blog/**
      tags_name_property: categories

hooks:
  - hooks/blog_metadata.py
  - hooks/diagrams.py

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      permalink_title: 链接到本节
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/site.css
  - assets/stylesheets/home-map.css
  - assets/stylesheets/blog.css
  - assets/stylesheets/footer.css

extra_javascript:
  - assets/javascripts/site-navigation.mjs
  - assets/javascripts/home-animation.mjs
  - assets/javascripts/diagram-drag.mjs
  - assets/javascripts/footer-motion.mjs
